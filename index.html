<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Catálogo 3D Interactivo</title>
    <link rel="icon" type="image/png" href="./enssamble_icon_64.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />

    <!-- Import Map: funciona directo en GitHub Pages sin bundler -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <!-- Lienzo principal Three.js (fondo transparente sobre degradado nocturno) -->
    <canvas id="stage-canvas" aria-label="Visor 3D de muebles"></canvas>

    <!-- Menú interactivo con forma de medialuna continua difuminada hacia el centro -->
    <aside id="crescent-nav" class="crescent-nav" aria-label="Selector de muebles">
      <!-- Luna continua vertical con halo radial difuminado (PC / Tablet / Móvil horizontal) -->
      <svg
        class="crescent-arc-svg crescent-arc-vertical"
        viewBox="0 0 220 560"
        fill="none"
        aria-hidden="true"
      >
        <defs>
          <linearGradient id="crescentGradV" x1="0" y1="36" x2="0" y2="524" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(218,229,255,0)" />
            <stop offset="20%" stop-color="rgba(218,229,255,0.42)" />
            <stop offset="50%" stop-color="rgba(255,255,255,0.92)" />
            <stop offset="80%" stop-color="rgba(218,229,255,0.42)" />
            <stop offset="100%" stop-color="rgba(218,229,255,0)" />
          </linearGradient>
          <radialGradient id="crescentRadialV" cx="122" cy="280" r="245" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(215,232,255,0.65)" />
            <stop offset="48%" stop-color="rgba(182,208,255,0.28)" />
            <stop offset="100%" stop-color="rgba(182,208,255,0)" />
          </radialGradient>
          <filter id="crescentBlurWideV" x="-60%" y="-25%" width="220%" height="150%">
            <feGaussianBlur stdDeviation="8" />
          </filter>
          <filter id="crescentBlurCoreV" x="-40%" y="-20%" width="180%" height="140%">
            <feGaussianBlur stdDeviation="2.4" />
          </filter>
        </defs>
        <path
          d="M 28 36 C 160 150, 160 410, 28 524 C 134 410, 134 150, 28 36 Z"
          fill="url(#crescentRadialV)"
          filter="url(#crescentBlurWideV)"
        />
        <path
          d="M 28 36 C 151 150, 151 410, 28 524 C 139 410, 139 150, 28 36 Z"
          fill="url(#crescentGradV)"
          filter="url(#crescentBlurCoreV)"
        />
      </svg>

      <!-- Luna continua horizontal con halo radial difuminado (Móvil vertical) -->
      <svg
        class="crescent-arc-svg crescent-arc-horizontal"
        viewBox="0 0 560 150"
        fill="none"
        aria-hidden="true"
      >
        <defs>
          <linearGradient id="crescentGradH" x1="36" y1="0" x2="524" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(218,229,255,0)" />
            <stop offset="20%" stop-color="rgba(218,229,255,0.42)" />
            <stop offset="50%" stop-color="rgba(255,255,255,0.92)" />
            <stop offset="80%" stop-color="rgba(218,229,255,0.42)" />
            <stop offset="100%" stop-color="rgba(218,229,255,0)" />
          </linearGradient>
          <radialGradient id="crescentRadialH" cx="280" cy="48" r="245" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(215,232,255,0.65)" />
            <stop offset="48%" stop-color="rgba(182,208,255,0.28)" />
            <stop offset="100%" stop-color="rgba(182,208,255,0)" />
          </radialGradient>
          <filter id="crescentBlurWideH" x="-25%" y="-60%" width="150%" height="220%">
            <feGaussianBlur stdDeviation="8" />
          </filter>
          <filter id="crescentBlurCoreH" x="-20%" y="-40%" width="140%" height="180%">
            <feGaussianBlur stdDeviation="2.4" />
          </filter>
        </defs>
        <path
          d="M 36 128 C 150 18, 410 18, 524 128 C 410 40, 150 40, 36 128 Z"
          fill="url(#crescentRadialH)"
          filter="url(#crescentBlurWideH)"
        />
        <path
          d="M 36 128 C 150 24, 410 24, 524 128 C 410 35, 150 35, 36 128 Z"
          fill="url(#crescentGradH)"
          filter="url(#crescentBlurCoreH)"
        />
      </svg>

      <div id="crescent-items" class="crescent-items" role="listbox" aria-label="Muebles"></div>

      <div class="crescent-controls">
        <button id="btn-prev" class="nav-arrow" type="button" aria-label="Mueble anterior" title="Anterior">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 15l-6-6-6 6" />
          </svg>
        </button>
        <span id="nav-counter" class="nav-counter">01 / 04</span>
        <button id="btn-next" class="nav-arrow" type="button" aria-label="Mueble siguiente" title="Siguiente">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>
      </div>
    </aside>

    <!-- Cabecera superior izquierda: botón 3 rayas + indicador + etiqueta activa únicamente -->
    <header class="brand-header">
      <button
        id="menu-toggle"
        class="menu-toggle-btn"
        type="button"
        aria-expanded="false"
        aria-controls="category-drawer"
        aria-label="Abrir categorías de muebles"
        title="Categorías"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16" />
          <path d="M4 12h16" />
          <path d="M4 17h16" />
        </svg>
      </button>
      <div class="brand-dot" id="brand-dot"></div>
      <span id="active-filter-chip" class="active-filter-chip">Todos</span>
    </header>

    <!-- Ventana desplegable de categorías -->
    <nav id="category-drawer" class="category-drawer" aria-label="Categorías de muebles" aria-hidden="true">
      <div class="category-drawer-header">
        <span class="category-drawer-title">Categorías</span>
        <button id="drawer-close" class="drawer-close-btn" type="button" aria-label="Cerrar menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6L6 18" />
            <path d="M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div id="category-list" class="category-list"></div>
      <p id="category-empty-msg" class="category-empty-msg" hidden></p>
    </nav>

    <!-- Herramienta de referencia real de tamaño: Cuadernillo A4 Avon arrastrable -->
    <div class="scale-prop-bar">
      <button
        id="btn-avon-toggle"
        class="scale-prop-btn"
        type="button"
        aria-pressed="false"
        title="Mostrar cuadernillo clásico A4 de Avon (21 × 29.7 cm) y arrastrarlo sobre el mueble"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
        </svg>
        <span>Guía A4 Avon</span>
      </button>
      <button
        id="btn-avon-rotate"
        class="scale-prop-rotate"
        type="button"
        hidden
        title="Girar cuadernillo 90°"
        aria-label="Girar cuadernillo A4 90 grados"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
          <path d="M21 3v5h-5" />
        </svg>
      </button>
    </div>

    <!-- Tarjeta de información del mueble activo (siempre arriba a la derecha, plegable con X / desplegable con +) -->
    <section id="info-card" class="info-card" aria-live="polite">
      <div class="info-header-row">
        <span id="info-index" class="info-index">01</span>
        <h1 id="info-title" class="info-title">Cargando...</h1>
        <button
          id="info-toggle"
          class="info-toggle-btn"
          type="button"
          aria-expanded="true"
          aria-label="Plegar información"
          title="Plegar información"
        ></button>
      </div>
      <div class="info-body">
        <div class="info-category-wrap">
          <span id="info-category" class="info-category">Dormitorio</span>
        </div>
        <p id="info-desc" class="info-desc"></p>
        <div class="info-specs">
          <div class="spec-pill">
            <span class="spec-label">Medidas</span>
            <span id="info-dims" class="spec-value"></span>
          </div>
          <div class="spec-pill">
            <span class="spec-label">Melamina</span>
            <span id="info-materials" class="spec-value spec-materials"></span>
          </div>
          <div class="spec-pill">
            <span class="spec-label">Paleta</span>
            <span id="info-palette" class="spec-swatches"></span>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="./src/main.js"></script>

    <!-- Live Reload automático solo en entorno local (en GitHub Pages se desactiva solo) -->
    <script>
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        let lastVersion = null;
        setInterval(async () => {
          try {
            const res = await fetch("/__version", { cache: "no-store" });
            if (!res.ok) return;
            const version = await res.text();
            if (lastVersion !== null && version !== lastVersion) location.reload();
            lastVersion = version;
          } catch {}
        }, 700);
      }
    </script>
  </body>
</html>
